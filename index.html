<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NOVA Websites designs modern websites for businesses and creators.">
  <title>NOVA Websites | Build Your Online Presence</title>
  <style>
    :root {
      --bg-black: #06080c;
      --bg-dark-blue: #0b111e;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #8a94a6;
      --card-bg: #0d1527;
      --input-bg: #070c14;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 6rem;
    }

    /* Header Bar Menu */
    .header {
      background-color: rgba(6, 8, 12, 0.95);
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      text-decoration: none;
    }

    .logo-icon {
      background-color: #3b82f6;
      color: white;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      border-radius: 4px;
      margin-right: 10px;
    }

    .logo-light { font-weight: 300; color: var(--text-muted); }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .nav-button {
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      color: #ffffff !important;
    }

    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    .eyebrow {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .section-intro {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3rem;
      gap: 2rem;
    }

    .section-intro h2 { font-size: 2.5rem; font-weight: 800; line-height: 1.1; }
    .section-intro .blue { color: var(--accent-blue); }
    .section-intro p { max-width: 450px; color: var(--text-muted); }

    /* Hero Unit Area */
    .hero { display: flex; justify-content: space-between; align-items: center; gap: 4rem; padding-top: 6rem; }
    .hero-content { flex: 1.2; }
    .hero-content h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; margin-bottom: 1.5rem; }
    .gradient-text { color: var(--accent-blue); }
    .hero-description { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 2.5rem; max-width: 500px; }
    .hero-buttons { display: flex; gap: 1rem; margin-bottom: 2rem; }

    .btn { padding: 0.8rem 1.8rem; border-radius: 4px; font-weight: 600; text-decoration: none; font-size: 0.95rem; display: inline-block; cursor: pointer; border: none; }
    .btn-primary { background-color: var(--accent-blue); color: white; }
    .btn-ghost { border: 1px solid rgba(255, 255, 255, 0.15); color: white; background: transparent; }
    .btn-outline { border: 1px solid rgba(255, 255, 255, 0.3); color: white; background: transparent; }

    .hero-visual { flex: 1; }
    .browser { background-color: var(--bg-dark-blue); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; overflow: hidden; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
    .browser-bar { background-color: #070c14; padding: 0.75rem 1rem; display: flex; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .browser-dots i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.2); margin-right: 4px; }
    .browser-bar span { margin-left: 20px; font-size: 0.75rem; color: var(--text-muted); }
    .browser-page { padding: 2.5rem; }
    .mock-brand { font-size: 0.8rem; font-weight: 700; margin-bottom: 2rem; }
    .mock-brand small { float: right; font-weight: 400; color: var(--text-muted); }
    .mock-title { font-size: 2.2rem; font-weight: 800; line-height: 1.2; margin-bottom: 1rem; }
    .mock-title em { color: var(--accent-blue); font-style: normal; }

    .marquee { border-top: 1px solid rgba(255, 255, 255, 0.08); border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding: 1rem 0; margin: 3rem 0; }
    .marquee div { display: flex; justify-content: space-around; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; }

    .service-grid { display: flex; gap: 2rem; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 2.5rem; }
    .service-card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    .service-card p { color: var(--text-muted); font-size: 0.95rem; }

    /* Work Elements Grid */
    .portfolio { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }
    .project-wide { grid-column: span 2; }
    .project-art { border-radius: 8px; padding: 3rem; min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(255, 255, 255, 0.05); }
    .art-tech { background: linear-gradient(135deg, #0a1c36 0%, #0d1527 100%); }
    .art-fitness { background: #16161a; }
    .art-creative { background: #0c0a12; }
    .art-nav { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 1px; }
    .art-big { font-size: 2.5rem; font-weight: 900; line-height: 1.1; }
    .art-big span { color: var(--accent-blue); }
    .art-caption { font-size: 0.7rem; color: var(--text-muted); }
    .project-caption { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; }
    .project-caption h3 { font-size: 1.1rem; }
    .project-caption p { font-size: 0.85rem; color: var(--text-muted); }

    /* Pricing Plans Configuration Columns */
    .pricing-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; }
    .price-card { background-color: var(--bg-dark-blue); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 2.5rem 1.5rem; position: relative; }
    .price-card.featured { border-color: var(--accent-blue); }
    .popular { position: absolute; top: -12px; right: 15px; background-color: var(--accent-blue); color: white; font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 2px; }
    .plan-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 0.5rem; }
    .price-card h3 { font-size: 1.5rem; margin-bottom: 1rem; }
    .price-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 2rem; min-height: 40px; }
    .price { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 1.5rem; }
    .price small { font-size: 0.85rem; color: var(--text-muted); font-weight: 400; }
    .price-card ul { list-style: none; margin-bottom: 2rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem;}
    .price-card ul li { font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-main); }
    .price-card .btn { width: 100%; text-align: center; }

    /* Client Feedback Blocks */
    .review-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .review { background-color: var(--bg-dark-blue); border: 1px solid rgba(255, 255, 255, 0.05); padding: 2rem; border-radius: 6px; }
    blockquote { font-size: 0.95rem; font-style: italic; margin-bottom: 1.5rem; }
    .review b { display: block; font-size: 0.9rem; }
    .review small { color: var(--text-muted); font-size: 0.75rem; }

    /* Project Forms Workspace Configuration Layouts */
    .order-section { display: grid; grid-template-columns: 1fr 1.2fr; gap: 4rem; }
    .payment-instructions-card { background: rgba(59, 130, 246, 0.03); border: 1px dashed rgba(59, 130, 246, 0.3); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; }
    .payment-instructions-card h4 { margin-bottom: 0.5rem; color: #fff; }
    .payment-instructions-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .email-card { background-color: var(--bg-dark-blue); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 6px; padding: 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .email-card span { font-size: 1.5rem; color: var(--accent-blue); }
    .email-card b { display: block; color: #fff; font-size: 0.95rem; }
    .order-form { background-color: var(--bg-dark-blue); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 2.5rem; }
    .form-heading { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    .form-row { display: flex; gap: 1rem; }
    .order-form label { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; width: 100%; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .order-form input, .order-form select, .order-form textarea { padding: 0.85rem; background-color: var(--input-bg); border: 1px solid rgba(255, 255, 255, 0.08); color: white; border-radius: 4px; font-size: 0.9rem; width: 100%; }

    .final-cta { background-color: var(--bg-dark-blue); padding: 4rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-top: 4rem; }
